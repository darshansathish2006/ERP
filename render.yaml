# Render Blueprint for Titans ERP (https://render.com/docs/blueprint-spec)
# New > Blueprint > pick this repository, then fill in TITANS_ADMIN_PASSWORD when asked.
services:
  - type: web
    name: titans-erp
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Admin login password for titanswindows1@gmail.com (the sales demo users share it).
      # Leave blank to use the default from the README.
      - key: TITANS_ADMIN_PASSWORD
        sync: false
    # The free plan has no persistent disk: the SQLite database is recreated (with demo data)
    # on every deploy or restart. For data that survives, switch to a paid plan and add:
    # disk:
    #   name: titans-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and set TITANS_DATA_DIR=/var/data in envVars.
